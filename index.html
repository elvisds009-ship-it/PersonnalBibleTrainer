<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bible Trainer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    select, button {
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }

    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
      margin-top: 20px;
    }

    .chapter {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      padding: 10px;
      background: #2c2c2c;
      border-radius: 10px;
    }

    input[type="checkbox"] {
      transform: scale(1.3);
    }
  </style>
</head>
<body>

<h1>📖 Bible Trainer</h1>

<select id="plan">
  <option value="1">Plan 1 an</option>
  <option value="2">Plan 2 ans</option>
  <option value="3">Plan 3 ans</option>
  <option value="random">Lecture aléatoire</option>
</select>

<button onclick="generatePlan()">Commencer</button>

<div class="card">
  <h2>Lecture du jour</h2>
  <div id="chapters"></div>
</div>

<script>
const bibleBooks = [
  "Genèse", "Exode", "Lévitique", "Nombres", "Deutéronome",
  "Josué", "Juges", "Ruth", "1 Samuel", "2 Samuel",
  "1 Rois", "2 Rois", "Matthieu", "Marc", "Luc", "Jean"
];

// nombre de chapitres simplifié (exemple)
const chaptersCount = 50;

// récupérer progression
let progress = JSON.parse(localStorage.getItem("progress")) || {};

function getTodayKey() {
  return new Date().toISOString().split("T")[0];
}

function generatePlan() {
  const plan = document.getElementById("plan").value;
  const container = document.getElementById("chapters");
  container.innerHTML = "";

  let chaptersPerDay;

  if (plan === "1") chaptersPerDay = 4;
  else if (plan === "2") chaptersPerDay = 2;
  else if (plan === "3") chaptersPerDay = 1;
  else chaptersPerDay = 3;

  let todayKey = getTodayKey();
  if (!progress[todayKey]) progress[todayKey] = [];

  for (let i = 0; i < chaptersPerDay; i++) {
    let book = bibleBooks[Math.floor(Math.random() * bibleBooks.length)];
    let chapter = Math.floor(Math.random() * chaptersCount) + 1;

    let id = book + chapter;

    let checked = progress[todayKey].includes(id) ? "checked" : "";

    container.innerHTML += `
      <div class="chapter">
        <span>${book} ${chapter}</span>
        <input type="checkbox" ${checked} onchange="toggle('${id}')">
      </div>
    `;
  }

  localStorage.setItem("progress", JSON.stringify(progress));
}

function toggle(id) {
  let todayKey = getTodayKey();

  if (!progress[todayKey]) progress[todayKey] = [];

  if (progress[todayKey].includes(id)) {
    progress[todayKey] = progress[todayKey].filter(x => x !== id);
  } else {
    progress[todayKey].push(id);
  }

  localStorage.setItem("progress", JSON.stringify(progress));
}
</script>

</body>
</html>
