<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Bible Trainer</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1e1e2f, #121212);
  color: white;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

.card {
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

select, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

button {
  background: #6C63FF;
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #574fd6;
}

.chapter {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  margin-top: 10px;
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
}

.progress {
  margin-top: 15px;
  font-size: 14px;
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">
  <h1>📖 Bible Trainer</h1>

  <div class="card">
    <select id="plan">
      <option value="1">Plan 1 an</option>
      <option value="2">Plan 2 ans</option>
      <option value="3">Plan 3 ans</option>
    </select>

    <button onclick="startPlan()">Commencer</button>

    <h3>Lecture du jour</h3>
    <div id="chapters"></div>

    <div class="progress" id="progressText"></div>
  </div>
</div>

<script>
// Structure simplifiée de la Bible (ordre réel)
const bible = [
  {name: "Genèse", chapters: 50},
  {name: "Exode", chapters: 40},
  {name: "Lévitique", chapters: 27},
  {name: "Nombres", chapters: 36},
  {name: "Deutéronome", chapters: 34},
  {name: "Josué", chapters: 24},
  {name: "Juges", chapters: 21},
  {name: "Ruth", chapters: 4},
  {name: "1 Samuel", chapters: 31},
  {name: "2 Samuel", chapters: 24},
  {name: "Matthieu", chapters: 28},
  {name: "Marc", chapters: 16},
  {name: "Luc", chapters: 24},
  {name: "Jean", chapters: 21}
];

// créer liste complète des chapitres
let fullList = [];
bible.forEach(book => {
  for (let i = 1; i <= book.chapters; i++) {
    fullList.push(`${book.name} ${i}`);
  }
});

let state = JSON.parse(localStorage.getItem("bibleState")) || {
  index: 0,
  plan: null,
  checked: {}
};

function getTodayKey() {
  return new Date().toISOString().split("T")[0];
}

function startPlan() {
  const plan = document.getElementById("plan").value;

  if (state.plan !== plan) {
    state.index = 0;
    state.checked = {};
    state.plan = plan;
  }

  generateToday();
}

function generateToday() {
  const container = document.getElementById("chapters");
  container.innerHTML = "";

  let chaptersPerDay;
  if (state.plan === "1") chaptersPerDay = Math.ceil(fullList.length / 365);
  if (state.plan === "2") chaptersPerDay = Math.ceil(fullList.length / 730);
  if (state.plan === "3") chaptersPerDay = Math.ceil(fullList.length / 1095);

  let todayKey = getTodayKey();
  if (!state.checked[todayKey]) state.checked[todayKey] = [];

  let todaysChapters = fullList.slice(state.index, state.index + chaptersPerDay);

  todaysChapters.forEach(chap => {
    let checked = state.checked[todayKey].includes(chap) ? "checked" : "";

    container.innerHTML += `
      <div class="chapter">
        <span>${chap}</span>
        <input type="checkbox" ${checked} onchange="toggle('${chap}')">
      </div>
    `;
  });

  updateProgress();
  save();
}

function toggle(chap) {
  let todayKey = getTodayKey();

  if (!state.checked[todayKey]) state.checked[todayKey] = [];

  if (state.checked[todayKey].includes(chap)) {
    state.checked[todayKey] = state.checked[todayKey].filter(c => c !== chap);
  } else {
    state.checked[todayKey].push(chap);
  }

  // si tout est coché → avancer
  let todaysChapters = document.querySelectorAll(".chapter");
  let allChecked = [...todaysChapters].every(el =>
    el.querySelector("input").checked
  );

  if (allChecked) {
    let chaptersPerDay = todaysChapters.length;
    state.index += chaptersPerDay;
  }

  updateProgress();
  save();
}

function updateProgress() {
  let percent = Math.floor((state.index / fullList.length) * 100);
  document.getElementById("progressText").innerText =
    `Progression : ${percent}%`;
}

function save() {
  localStorage.setItem("bibleState", JSON.stringify(state));
}
</script>

</body>
</html>
