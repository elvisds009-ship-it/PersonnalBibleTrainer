<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ma Bible</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f6f6f7;
  color: #1c1c1e;
}

/* CONTAINER */
.container {
  max-width: 420px;
  margin: auto;
  padding: 30px 20px;
  text-align: center;
}

/* TITLE */
h1 {
  font-size: 26px;
  margin-bottom: 5px;
}

.subtitle {
  color: #6e6e73;
  margin-bottom: 25px;
}

/* CARD */
.card {
  background: white;
  border-radius: 20px;
  padding: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

/* PLAN */
.plan {
  text-align: left;
  padding: 18px;
  border-radius: 14px;
  margin: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.plan:hover {
  background: #f2f2f7;
}

.plan.active {
  background: #eef0ff;
  border: 2px solid #5b5cff;
}

.plan-title {
  font-weight: 600;
  font-size: 16px;
}

.plan-desc {
  color: #6e6e73;
  font-size: 14px;
  margin-top: 4px;
}

/* BUTTON */
button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  color: white;
  cursor: pointer;

  background: linear-gradient(90deg, #5b5cff, #6c63ff);
}

/* TODAY PAGE */
.chapter {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  margin-top: 10px;
  background: white;
  border-radius: 14px;
  border: 1px solid #e5e5ea;
}

.chapter.done {
  opacity: 0.5;
}

/* PROGRESS */
.progress-bar {
  height: 8px;
  background: #e5e5ea;
  border-radius: 10px;
  overflow: hidden;
  margin: 20px 0;
}

.progress-fill {
  height: 100%;
  background: #5b5cff;
  width: 0%;
}

/* NAV */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  border-top: 1px solid #ddd;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<!-- PAGE SELECT -->
<div id="selectPage">
  <h1>Bienvenue</h1>
  <div class="subtitle">Choisis ton rythme</div>

  <div class="card">
    <div class="plan" onclick="selectPlan('1', this)">
      <div class="plan-title">1 an</div>
      <div class="plan-desc">~3-4 chapitres / jour</div>
    </div>

    <div class="plan" onclick="selectPlan('2', this)">
      <div class="plan-title">2 ans</div>
      <div class="plan-desc">~1-2 chapitres / jour</div>
    </div>

    <div class="plan" onclick="selectPlan('3', this)">
      <div class="plan-title">3 ans</div>
      <div class="plan-desc">~1 chapitre / jour</div>
    </div>

    <div class="plan" onclick="selectPlan('random', this)">
      <div class="plan-title">Aléatoire</div>
      <div class="plan-desc">Lecture libre</div>
    </div>
  </div>

  <button onclick="start()">Commencer</button>
</div>

<!-- PAGE TODAY -->
<div id="todayPage" class="hidden">
  <h1>Aujourd'hui</h1>

  <div class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>

  <div id="chapters"></div>
</div>

</div>

<!-- NAV -->
<div class="nav">
  <div onclick="showPage('today')">📖</div>
  <div onclick="showPage('select')">⚙️</div>
</div>

<script>
const bible = [
  {name:"Genèse",chapters:50},
  {name:"Exode",chapters:40},
  {name:"Matthieu",chapters:28},
  {name:"Jean",chapters:21}
];

let fullList = [];
bible.forEach(b=>{
  for(let i=1;i<=b.chapters;i++){
    fullList.push(`${b.name} ${i}`);
  }
});

let state = JSON.parse(localStorage.getItem("state")) || {
  plan:null,
  index:0,
  checked:{}
};

let selectedPlan = null;

function selectPlan(plan, el){
  selectedPlan = plan;
  document.querySelectorAll(".plan").forEach(p=>p.classList.remove("active"));
  el.classList.add("active");
}

function start(){
  if(!selectedPlan) return alert("Choisis un plan");

  state.plan = selectedPlan;
  state.index = 0;
  state.checked = {};
  save();

  showPage("today");
  generate();
}

function showPage(p){
  document.getElementById("selectPage").classList.toggle("hidden", p==="today");
  document.getElementById("todayPage").classList.toggle("hidden", p!=="today");
}

function getToday(){
  return new Date().toISOString().split("T")[0];
}

function generate(){
  let container = document.getElementById("chapters");
  container.innerHTML = "";

  let today = getToday();
  if(!state.checked[today]) state.checked[today]=[];

  let perDay = 2;
  if(state.plan==="1") perDay = 4;
  if(state.plan==="2") perDay = 2;
  if(state.plan==="3") perDay = 1;

  let list = [];

  if(state.plan==="random"){
    for(let i=0;i<3;i++){
      list.push(fullList[Math.floor(Math.random()*fullList.length)]);
    }
  } else {
    list = fullList.slice(state.index, state.index+perDay);
  }

  list.forEach(ch=>{
    let done = state.checked[today].includes(ch);

    container.innerHTML += `
      <div class="chapter ${done?'done':''}">
        <span>${ch}</span>
        <input type="checkbox" ${done?'checked':''} onchange="toggle('${ch}')">
      </div>
    `;
  });

  updateProgress();
}

function toggle(ch){
  let today = getToday();

  if(state.checked[today].includes(ch)){
    state.checked[today]=state.checked[today].filter(x=>x!==ch);
  } else {
    state.checked[today].push(ch);
  }

  let allChecked = [...document.querySelectorAll("input")]
    .every(i=>i.checked);

  if(allChecked && state.plan!=="random"){
    state.index += document.querySelectorAll(".chapter").length;
  }

  save();
  generate();
}

function updateProgress(){
  let percent = Math.floor((state.index/fullList.length)*100);
  document.getElementById("progressFill").style.width = percent+"%";
}

function save(){
  localStorage.setItem("state", JSON.stringify(state));
}

if(state.plan){
  showPage("today");
  generate();
}
</script>

</body>
</html>
